<!DOCTYPE html>
<html lang="be">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hieorhi Skamarochaŭ</title>

<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">

<meta name="description" content="Personal portfolio of Hieorhi Skamarochaŭ">
<meta name="theme-color" content="#ffffff">

<meta property="og:title" content="Hieorhi Skamarochaŭ">
<meta property="og:description" content="Ja jo (tutejšy chuj)">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hieorhi.github.io/">
<meta property="og:image" content="https://hieorhi.github.io/og.png">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  min-height: 100%;
  font-family: "Helvetica Neue", Arial, sans-serif;
  background: #ffffff;
  color: #111;
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
  
.skip-to-main {
  position: absolute;
  top: -40px;
  left: 0;
  background: #000;
  color: #fff;
  padding: 8px 16px;
  text-decoration: none;
  z-index: 100;
}

.skip-to-main:focus {
  top: 0;
}

header {
  padding: clamp(24px, 5vw, 48px) 16px;
  text-align: center;
}

header h1 {
  font-size: clamp(2rem, 5vw, 3rem);
  font-weight: 600;
}

main {
  flex: 1; 
  display: flex;
  justify-content: center;
  padding: clamp(16px, 4vw, 32px);
}

.projects-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 300px));
  gap: clamp(20px, 4vw, 32px);
  justify-content: center;
  max-width: 1200px;
  width: 100%;
}

.project {
  width: 100%;
  aspect-ratio: 1 / 1;
  border: 2px solid #000;
  display: flex;
  flex-direction: column;
  text-decoration: none;
  color: inherit;
  background: #fff;
  transition: all 0.3s ease;
  animation: fadeIn 0.6s ease forwards;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.project:hover,
.project:focus-visible {
  background: #fafafa;
  transform: translateY(-4px) scale(1.05);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
}

.project-image {
  flex: 1;
  overflow: hidden;
  background: #f5f5f5;
}

.project-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.project-title {
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-top: 2px solid #000;
  font-size: clamp(0.95rem, 2vw, 1.05rem);
  font-weight: 500;
  padding: 0 8px;
}

footer {
  padding: 32px 16px;
  text-align: center;
  color: #666;
  font-size: clamp(0.85rem, 2vw, 0.9rem);
  border-top: 1px solid #e0e0e0;
  margin-top: 32px;
}

@media (prefers-reduced-motion: reduce) {
  .project {
    animation: none;
  }
  
  .project:hover,
  .project:focus-visible {
    transform: none;
    transition: none;
    background: #f0f0f0;
    box-shadow: none;
    outline: 3px solid #000;
    outline-offset: 2px;
  }
  
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>

<a href="#main-content" class="skip-to-main">Skip to main content</a>

<header>
  <h1>Hieorhi Skamarochaŭ</h1>
</header>

<main id="main-content">
  <div class="projects-grid">
    
    <a class="project" href="https://hieorhi.github.io/Ptuszka/">
      <div class="project-image">
        <img src="ptuszka.png" alt="Ptuška" loading="lazy">
      </div>
      <div class="project-title">
        Ptuška
      </div>
    </a>
    
  </div>
</main>

<footer>
  <p>© 2026 Hieorhi Skamarochaŭ</p>
</footer>

</body>
</html>
