    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f4f8;
            user-select: none;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            width: 360px;
            min-height: 260px;
            perspective: 1000px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.5s;
            transform-style: preserve-3d;
        }
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            min-height: 260px;
            backface-visibility: hidden;
            border-radius: 20px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        .card-front {
            background: white;
        }
        .card-back {
            background: #1a1a2e;
            color: white;
            transform: rotateY(180deg);
        }
        .hanzi {
            font-size: 64px;
            margin-bottom: 10px;
        }
        .pinyin {
            font-size: 24px;
            color: #e94560;
            margin-bottom: 20px;
        }
        .meaning {
            font-size: 20px;
            opacity: 0.9;
        }
        .hint {
            font-size: 14px;
            color: #888;
            margin-top: 30px;
        }
        .counter {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 15px;
        }
        .controls {
            display: flex;
            gap: 15px;
        }
        button {
            padding: 12px 28px;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .btn-know {
            background: #2ecc71;
            color: white;
        }
        .btn-dont-know {
            background: #e94560;
            color: white;
        }
        .completed {
            font-size: 24px;
            color: #2ecc71;
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>

    const cardEl = document.getElementById('card');
    const frontHanzi = document.getElementById('front-hanzi');
    const frontPinyin = document.getElementById('front-pinyin');
    const backHanzi = document.getElementById('back-hanzi');
    const backPinyin = document.getElementById('back-pinyin');
    const backMeaning = document.getElementById('back-meaning');
    const counter = document.getElementById('counter');
    const controls = document.getElementById('controls');
    const completedEl = document.getElementById('completed');

    function renderCard() {
        if (cards.length === 0) {
            // Все слова выучены
            cardEl.style.display = 'none';
            counter.style.display = 'none';
            controls.style.display = 'none';
            completedEl.style.display = 'block';
            return;
        }
        cardEl.style.display = 'block';
        counter.style.display = 'block';
        controls.style.display = 'flex';
        completedEl.style.display = 'none';
        const card = cards[currentIndex];
        frontHanzi.textContent = card.hanzi;
        frontPinyin.textContent = card.pinyin;
        backHanzi.textContent = card.hanzi;
        backPinyin.textContent = card.pinyin;
        backMeaning.textContent = card.meaning;
        counter.textContent = `Карточка ${currentIndex + 1} из ${cards.length}`;
        // Сбрасываем флип, если был
        if (isFlipped) {
            cardEl.classList.remove('flipped');
            isFlipped = false;
        }
    }

    // Обработчик клика по карточке — переворот
    cardEl.addEventListener('click', () => {
        if (cards.length === 0) return;
        cardEl.classList.toggle('flipped');
        isFlipped = !isFlipped;
    });

    function knowCard() {
        if (cards.length === 0) return;
        // Удаляем текущую карточку
        cards.splice(currentIndex, 1);
        // Если удалили последний элемент, индекс может стать равным длине массива
        if (cards.length > 0 && currentIndex >= cards.length) {
            currentIndex = 0;
        }
        // Если после удаления массив пуст, renderCard сама скроет всё
        renderCard();
    }

    function dontKnowCard() {
        if (cards.length === 0) return;
        // Переход к следующей, карточка остаётся
        currentIndex = (currentIndex + 1) % cards.length;
        renderCard();
    }

    // Первоначальный рендеринг
    renderCard();
