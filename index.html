<meta name="description" content="Personal portfolio of Hieorhi Skamarochaŭ">

<!-- Open Graph (Telegram / Discord) -->
<meta property="og:title" content="Hieorhi Skamarochaŭ">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  min-height: 100%;
  font-family: Helvetica Neue, Arial, sans-serif;
  background: #ffffff;
  color: #111;
}

/* Header */
header {
  padding: 32px 16px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 3rem;
  font-weight: 600;
}

/* Projects container with grid */
main {
  display: flex;
  justify-content: center;
  padding: 32px;
}

.projects-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 260px));
  gap: 32px;
  justify-content: center;
  max-width: 1200px;
}

/* Project square */
.project {
  width: 260px;
  height: 260px;
  border: 2px solid #000;
  display: flex;
  flex-direction: column;
  text-decoration: none;
  color: inherit;
  background: #fff;
  transition: background 0.2s ease;
}

/* Hover / focus */
.project:hover,
.project:focus-visible {
  background: #fafafa;
  outline: none;
}

/* Screenshot area */
.project-image {
  flex: 1;
  overflow: hidden;
  background: #f5f5f5;
}

.project-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Title area */
.project-title {
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-top: 2px solid #000;
  font-size: 1.05rem;
}

/* Tablet */
@media (max-width: 768px) {
  .projects-grid {
    grid-template-columns: repeat(auto-fit, minmax(240px, 240px));
    gap: 24px;
  }
  
  .project {
    width: 240px;
    height: 240px;
  }
}

/* Mobile */
@media (max-width: 480px) {
  header h1 {
    font-size: 2rem;
  }
  
  .projects-grid {
    grid-template-columns: 1fr;
    gap: 20px;
    padding: 0;
  }
  
  .project {
    width: 100%;
    max-width: 320px;
    height: 280px;
    justify-self: center;
  }
}
</style>
</head>

<body>

<header>
  <h1>Hieorhi Skamarochaŭ</h1>
</header>

<main>
  <div class="projects-grid">
    <a class="project"
       href="https://hieorhi.github.io/Ptuszka/"
       target="_blank"
       rel="noopener noreferrer">
      <div class="project-image">
        <img src="ptuszka.png" alt="Ptuška">
      </div>
      <div class="project-title">
        Ptuška
      </div>
    </a>
    
    <!-- Add more projects here as needed -->
    <!-- Example:
    <a class="project"
       href="https://example.com"
       target="_blank"
       rel="noopener noreferrer">
      <div class="project-image">
        <img src="project2.png" alt="Project 2">
      </div>
      <div class="project-title">
        Project Name
      </div>
    </a>
    -->
  </div>
</main>

</body>
</html>
