<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Ptuška</title>
    <meta name="description" content="Prostaja hulnia">
    <meta name="keywords" content="ptuška, ptuszka, птушка">
    <meta name="author" content="Hieorhi">
    
    <link rel="icon" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    
    <meta property="og:title" content="Ptuška">
    <meta property="og:description" content="Prostaja hulnia">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
        }
        
        #gameContainer {
            position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        
        canvas {
            display: block;
            background-color: black;
        }
        
        #resetButton {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            padding: 8px 15px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        
        #resetButton:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }
        
        #score {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 48px;
            font-weight: bold;
            color: white;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }
        
        #score.visible {
            opacity: 1;
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            display: none;
            background-color: rgba(0, 0, 0, 0.95);
            padding: 30px;
            border-radius: 10px;
            border: 3px solid white;
            color: white;
        }
        
        #finalScore {
            font-size: 20px;
            margin-top: 15px;
            color: #ddd;
        }
        
        #bestScore {
            font-size: 18px;
            margin-top: 10px;
            color: #aaa;
        }
        
        #totalCoinsDisplay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            font-weight: bold;
            color: white;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }
        
        #totalCoinsDisplay.visible {
            opacity: 1;
        }
        
        #coinsThisRun {
            font-size: 18px;
            margin-top: 10px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <button id="resetButton">Сброс</button>
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div id="score">0</div>
        <div id="totalCoinsDisplay">🪙 0</div>
        <div id="gameOver">
            <div>ИГРА ОКОНЧЕНА</div>
            <div id="finalScore"></div>
            <div id="bestScore"></div>
            <div id="coinsThisRun"></div>
            <div style="font-size: 16px; margin-top: 15px;">Нажмите для перезапуска</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameOverDiv = document.getElementById('gameOver');
        const scoreDiv = document.getElementById('score');
        const finalScoreDiv = document.getElementById('finalScore');
        const bestScoreDiv = document.getElementById('bestScore');
        const coinsThisRunDiv = document.getElementById('coinsThisRun');
        const totalCoinsDisplay = document.getElementById('totalCoinsDisplay');
        const resetButton = document.getElementById('resetButton');
        
        // Основные параметры игры
        const GRAVITY = 0.5;
        const JUMP_STRENGTH = -8;
        const PIPE_SPEED = 3;
        const PIPE_WIDTH = 60;
        const PIPE_GAP = 180;
        const PIPE_SPAWN_INTERVAL = 90;
        const MOVE_SPEED = 2;
        
        // Флаги прогрессии (сохраняются в localStorage)
        let progressFlags = {
            hasBirdCreated: false,
            hasMovedLeft: false,
            hasActivatedJumps: false,
            hasActivatedGravity: false,
            hasPipesEnabled: false,
            hasCoinsEnabled: false,
            hasSeenScore: false
        };
        
        // Счётчик прыжков - НЕ сохраняется, сбрасывается при каждом рестарте
        let jumpCount = 0;
        
        // Загружаем флаги из localStorage
        function loadProgress() {
            const saved = localStorage.getItem('progressFlags');
            if (saved) {
                progressFlags = JSON.parse(saved);
            }
        }
        
        // Сохраняем флаги в localStorage
        function saveProgress() {
            localStorage.setItem('progressFlags', JSON.stringify(progressFlags));
        }
        
        // Полный сброс прогресса
        function resetProgress() {
            progressFlags = {
                hasBirdCreated: false,
                hasMovedLeft: false,
                hasActivatedJumps: false,
                hasActivatedGravity: false,
                hasPipesEnabled: false,
                hasCoinsEnabled: false,
                hasSeenScore: false
            };
            jumpCount = 0;
            bestScore = 0;
            totalCoins = 0;
            coinsThisRun = 0;
            localStorage.clear();  // Полная очистка всех сохраненных данных
            saveProgress();  // Сохраняем пустые флаги
            restart();
        }
        
        // Объект птички
        let bird = {
            x: 200 - 15,  // Центр экрана по умолчанию
            y: 300 - 15,
            targetX: 80,
            width: 30,
            height: 30,
            velocity: 0,
            isMovingLeft: false
        };
        
        let pipes = [];
        let coins = [];  // Массив монет на экране
        let frameCount = 0;
        let gameActive = true;
        let score = 0;
        let bestScore = localStorage.getItem('bestScore') || 0;
        let totalCoins = parseInt(localStorage.getItem('totalCoins')) || 0;  // Общее за все катки
        let coinsThisRun = 0;  // Собрано в этой катке
        let scoreVisible = false;
        let gameLoopInterval = null;
        
        // Анимация появления птички
        let birdOpacity = 0;
        let birdAppearing = false;
        
        // Инициализация при загрузке
        function init() {
            loadProgress();
            
            // Инициализируем счётчик прыжков
            jumpCount = 0;
            
            // Если птичка уже создана, показываем её сразу
            if (progressFlags.hasBirdCreated) {
                birdOpacity = 1;
                birdAppearing = false;
            } else {
                birdOpacity = 0;
                birdAppearing = false;
            }
            
            // Если птичка уже создана и переместилась влево, стартуем слева
            if (progressFlags.hasBirdCreated && progressFlags.hasMovedLeft) {
                bird.x = 80;
            } else {
                bird.x = 200 - 15;  // Центр
            }
            
            // Показываем счётчик если уже видели
            if (progressFlags.hasSeenScore) {
                scoreDiv.classList.add('visible');
                scoreVisible = true;
            }
            
            // Показываем счётчик монет если фича открыта
            if (progressFlags.hasCoinsEnabled) {
                totalCoinsDisplay.textContent = `🪙 ${totalCoins}`;
                totalCoinsDisplay.classList.add('visible');
            }
        }
        
        // Функция создания труб
        function createPipe() {
            if (!progressFlags.hasPipesEnabled) return;
            
            const minGapY = 50;
            const maxGapY = canvas.height - PIPE_GAP - 50;
            const gapY = Math.random() * (maxGapY - minGapY) + minGapY;
            
            pipes.push({
                x: canvas.width,
                gapY: gapY,
                scored: false
            });
            
            // Создаём монету в gap'е трубы (если фича открыта)
            if (progressFlags.hasCoinsEnabled) {
                // Монета в центре gap'а с небольшим случайным смещением
                const coinYOffset = (Math.random() - 0.5) * (PIPE_GAP - 60); // Отступ 30px от краёв gap'а
                const coinY = gapY + PIPE_GAP / 2 + coinYOffset;
                
                coins.push({
                    x: canvas.width + 100, // Чуть впереди трубы
                    y: coinY,
                    radius: 15,
                    collected: false
                });
            }
        }
        
        // Функция прыжка
        function jump() {
            if (!gameActive) return;
            
            if (!progressFlags.hasBirdCreated) {
                // Самый первый клик - появление птички с анимацией
                progressFlags.hasBirdCreated = true;
                birdAppearing = true;
                saveProgress();
            } else if (!progressFlags.hasMovedLeft) {
                // Второй клик - начать движение влево
                bird.isMovingLeft = true;
            } else if (progressFlags.hasPipesEnabled && progressFlags.hasCoinsEnabled) {
                // Все этапы пройдены - обычный прыжок
                bird.velocity = JUMP_STRENGTH;
            } else if (!progressFlags.hasActivatedJumps) {
                // Третий клик - активировать прыжки (первый прыжок, БЕЗ гравитации)
                progressFlags.hasActivatedJumps = true;
                jumpCount = 1;
                saveProgress();
                bird.velocity = JUMP_STRENGTH;
            } else if (jumpCount < 3) {
                // Прыжки 2-3 (всё ещё без гравитации)
                jumpCount++;
                bird.velocity = JUMP_STRENGTH;
                
                // На 3-м прыжке активируем гравитацию
                if (jumpCount === 3) {
                    progressFlags.hasActivatedGravity = true;
                    saveProgress();
                }
            } else if (jumpCount < 13) {
                // Прыжки 4-13 (с гравитацией)
                jumpCount++;
                bird.velocity = JUMP_STRENGTH;
                
                // На 13-м прыжке активируем трубы
                if (jumpCount === 13) {
                    progressFlags.hasPipesEnabled = true;
                    saveProgress();
                }
            } else if (jumpCount < 40) {
                // Прыжки 14-40 (с трубами)
                jumpCount++;
                bird.velocity = JUMP_STRENGTH;
                
                // На 40-м прыжке активируем монетки
                if (jumpCount === 40) {
                    progressFlags.hasCoinsEnabled = true;
                    saveProgress();
                }
            } else {
                // Обычный прыжок (все фичи открыты)
                bird.velocity = JUMP_STRENGTH;
            }
        }
        
        // Проверка столкновений
        function checkCollision() {
            // Проверка границ экрана - работает ВСЕГДА
            if (bird.y + bird.height >= canvas.height || bird.y <= 0) {
                return true;
            }
            
            // Проверка труб - только когда они включены
            if (progressFlags.hasPipesEnabled) {
                for (let pipe of pipes) {
                    if (bird.x + bird.width >= pipe.x && bird.x <= pipe.x + PIPE_WIDTH) {
                        if (bird.y <= pipe.gapY || bird.y + bird.height >= pipe.gapY + PIPE_GAP) {
                            return true;
                        }
                    }
                }
            }
            
            return false;
        }
        
        // Обновление счёта
        function updateScore() {
            for (let pipe of pipes) {
                if (!pipe.scored && pipe.x + PIPE_WIDTH < bird.x) {
                    pipe.scored = true;
                    score++;
                    scoreDiv.textContent = score;
                    
                    // Показываем счётчик после первой трубы
                    if (!progressFlags.hasSeenScore) {
                        progressFlags.hasSeenScore = true;
                        saveProgress();
                        scoreDiv.classList.add('visible');
                        scoreVisible = true;
                    }
                    
                    if (score > bestScore) {
                        bestScore = score;
                        localStorage.setItem('bestScore', bestScore);
                    }
                }
            }
        }
        
        // Сбор монет
        function collectCoins() {
            if (!progressFlags.hasCoinsEnabled) return;
            
            for (let coin of coins) {
                if (coin.collected) continue;
                
                // Проверка столкновения птички с монетой
                const dx = (bird.x + bird.width / 2) - coin.x;
                const dy = (bird.y + bird.height / 2) - coin.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < coin.radius + bird.width / 2) {
                    coin.collected = true;
                    coinsThisRun++;
                    totalCoins++;
                    localStorage.setItem('totalCoins', totalCoins);
                    totalCoinsDisplay.textContent = `🪙 ${totalCoins}`;
                }
            }
        }
        
        // Перезапуск игры
        function restart() {
            // Останавливаем старый цикл если есть
            if (gameLoopInterval) {
                clearInterval(gameLoopInterval);
                gameLoopInterval = null;
            }
            
            // Сбрасываем счётчик прыжков
            jumpCount = 0;
            
            // Сбрасываем монетки за катку
            coinsThisRun = 0;
            
            // Сбрасываем opacity в зависимости от прогресса
            if (progressFlags.hasBirdCreated) {
                birdOpacity = 1;
                birdAppearing = false;
            } else {
                birdOpacity = 0;
                birdAppearing = false;
            }
            
            // Сбрасываем позицию в зависимости от прогресса
            if (progressFlags.hasBirdCreated && progressFlags.hasMovedLeft) {
                bird.x = 80;
            } else {
                bird.x = 200 - 15;
            }
            
            bird.y = 300 - 15;
            bird.velocity = 0;
            bird.isMovingLeft = false;
            pipes = [];
            coins = [];  // Очищаем монеты на экране
            frameCount = 0;
            score = 0;
            gameActive = true;
            gameOverDiv.style.display = 'none';
            scoreDiv.textContent = '0';
            
            // Счётчик видим только если уже проходили первую трубу
            if (progressFlags.hasSeenScore) {
                scoreDiv.classList.add('visible');
                scoreVisible = true;
            } else {
                scoreDiv.classList.remove('visible');
                scoreVisible = false;
            }
            
            // Счётчик монет видим если фича открыта
            if (progressFlags.hasCoinsEnabled) {
                totalCoinsDisplay.classList.add('visible');
            } else {
                totalCoinsDisplay.classList.remove('visible');
            }
            
            startGameLoop();
        }
        
        // Основной игровой цикл
        function gameLoop() {
            if (!gameActive) {
                if (gameLoopInterval) {
                    clearInterval(gameLoopInterval);
                    gameLoopInterval = null;
                }
                return;
            }
            
            // Очистка экрана
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Логика движения птички
            if (bird.isMovingLeft && !progressFlags.hasMovedLeft) {
                // Плавное движение влево
                if (bird.x > bird.targetX) {
                    bird.x -= MOVE_SPEED;
                    if (bird.x <= bird.targetX) {
                        bird.x = bird.targetX;
                        bird.isMovingLeft = false;
                        progressFlags.hasMovedLeft = true;
                        saveProgress();
                    }
                }
                // НЕТ гравитации пока движемся
                bird.velocity = 0;
            } else if (progressFlags.hasActivatedGravity) {
                // Полная гравитация после 4-го прыжка
                bird.velocity += GRAVITY;
                bird.y += bird.velocity;
            } else if (progressFlags.hasActivatedJumps) {
                // Прыжки без гравитации - летим вверх и зависаем
                if (bird.velocity < 0) {
                    // Замедляем прыжок вверх
                    bird.velocity += 0.5;
                    if (bird.velocity >= 0) {
                        bird.velocity = 0; // Останавливаемся, не падаем
                    }
                }
                bird.y += bird.velocity;
            }
            // Если hasMovedLeft = true но hasActivatedJumps = false,
            // птичка просто висит слева без движения
            
            // Анимация появления птички
            if (birdAppearing) {
                birdOpacity += 0.02;  // Плавное появление
                if (birdOpacity >= 1) {
                    birdOpacity = 1;
                    birdAppearing = false;
                }
            } else if (progressFlags.hasBirdCreated) {
                birdOpacity = 1;
            }
            
            // Рисуем птичку (только если она уже создана)
            if (progressFlags.hasBirdCreated) {
                ctx.globalAlpha = birdOpacity;
                ctx.fillStyle = 'white';
                ctx.fillRect(bird.x, bird.y, bird.width, bird.height);
                ctx.globalAlpha = 1.0;  // Восстанавливаем прозрачность для остального
            }
            
            frameCount++;
            
            // Создание труб (и монет вместе с ними)
            if (progressFlags.hasPipesEnabled && frameCount % PIPE_SPAWN_INTERVAL === 0) {
                createPipe();
            }
            
            // Обновление и отрисовка труб
            for (let i = pipes.length - 1; i >= 0; i--) {
                let pipe = pipes[i];
                pipe.x -= PIPE_SPEED;
                
                if (pipe.x + PIPE_WIDTH < 0) {
                    pipes.splice(i, 1);
                    continue;
                }
                
                // Верхняя труба
                ctx.fillStyle = 'white';
                ctx.fillRect(pipe.x, 0, PIPE_WIDTH, pipe.gapY);
                
                // Нижняя труба
                ctx.fillStyle = 'white';
                ctx.fillRect(pipe.x, pipe.gapY + PIPE_GAP, PIPE_WIDTH, canvas.height - pipe.gapY - PIPE_GAP);
            }
            
            // Обновление и отрисовка монет
            for (let i = coins.length - 1; i >= 0; i--) {
                let coin = coins[i];
                
                if (coin.collected) {
                    coins.splice(i, 1);
                    continue;
                }
                
                coin.x -= PIPE_SPEED;
                
                if (coin.x + coin.radius < 0) {
                    coins.splice(i, 1);
                    continue;
                }
                
                // Рисуем монету (белый кружок)
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(coin.x, coin.y, coin.radius, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Сбор монет
            if (progressFlags.hasCoinsEnabled) {
                collectCoins();
            }
            
            // Обновление счёта
            if (progressFlags.hasPipesEnabled) {
                updateScore();
            }
            
            // Проверка столкновений
            if (checkCollision()) {
                gameActive = false;
                if (gameLoopInterval) {
                    clearInterval(gameLoopInterval);
                    gameLoopInterval = null;
                }
                finalScoreDiv.textContent = `Ваш счёт: ${score}`;
                bestScoreDiv.textContent = `Лучший результат: ${bestScore}`;
                
                // Показываем монетки за катку если фича открыта
                if (progressFlags.hasCoinsEnabled) {
                    coinsThisRunDiv.textContent = `Монет собрано: ${coinsThisRun}`;
                    coinsThisRunDiv.style.display = 'block';
                } else {
                    coinsThisRunDiv.style.display = 'none';
                }
                
                gameOverDiv.style.display = 'block';
                return;
            }
        }
        
        // Функция запуска игрового цикла
        function startGameLoop() {
            if (gameLoopInterval) {
                clearInterval(gameLoopInterval);
            }
            gameLoopInterval = setInterval(gameLoop, 1000 / 60); // 60 FPS
        }
        
        // Обработчики событий
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (gameActive) {
                    jump();
                } else {
                    restart();
                }
            }
        });
        
        canvas.addEventListener('click', () => {
            if (gameActive) {
                jump();
            } else {
                restart();
            }
        });
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (gameActive) {
                jump();
            } else {
                restart();
            }
        });
        
        resetButton.addEventListener('click', () => {
            resetProgress();
        });
        
        // Запуск
        init();
        startGameLoop();
    </script>
</body>
</html>
