<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ptuška</title>
<style>
    body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #f0f0f0;
    }
    #gameContainer {
        position: relative;
    }
    canvas {
        background: white;
        border: 2px solid black;
        display: block;
    }
    #gameOver {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        font-size: 24px;
        font-weight: bold;
        background: rgba(255,255,255,0.8);
    }
</style>
</head>
<body>

<div id="gameContainer">
    <canvas id="canvas" width="400" height="600"></canvas>
    <div id="gameOver">
        <div>ИГРА ОКОНЧЕНА</div>
        <div style="font-size:16px">Нажмите для перезапуска</div>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const gameOverEl = document.getElementById('gameOver');

/* Константы */
const GRAVITY = 0.5;
const JUMP = -8;
const PIPE_SPEED = 3;
const PIPE_WIDTH = 60;
const PIPE_GAP = 180;
const PIPE_INTERVAL = 90;

const BIRD_SIZE = 30;
const BIRD_X = 80;
const BIRD_START_Y = 250;

/* Состояние */
let bird;
let pipes;
let frame;
let gameActive;

/* Инициализация */
function resetGame() {
    bird = {
        x: BIRD_X,
        y: BIRD_START_Y,
        size: BIRD_SIZE,
        velocity: 0
    };
    pipes = [];
    frame = 0;
    gameActive = true;
    gameOverEl.style.display = 'none';
}

/* Трубы */
function spawnPipe() {
    const margin = 50;
    const gapY = Math.random() *
        (canvas.height - PIPE_GAP - margin * 2) + margin;

    pipes.push({
        x: canvas.width,
        topHeight: gapY,
        bottomY: gapY + PIPE_GAP
    });
}

/* Update */
function updateBird() {
    bird.velocity += GRAVITY;
    bird.y += bird.velocity;

    // верхняя граница — clamp
    if (bird.y < 0) {
        bird.y = 0;
        bird.velocity = 0;
    }

    // нижняя граница — смерть
    if (bird.y + bird.size > canvas.height) {
        endGame();
    }
}

function updatePipes() {
    for (let i = pipes.length - 1; i >= 0; i--) {
        pipes[i].x -= PIPE_SPEED;
        if (pipes[i].x + PIPE_WIDTH < 0) {
            pipes.splice(i, 1);
        }
    }

    if (frame % PIPE_INTERVAL === 0) {
        spawnPipe();
    }
}

function checkPipeCollision() {
    for (const p of pipes) {
        const inX =
            bird.x + bird.size > p.x &&
            bird.x < p.x + PIPE_WIDTH;

        if (!inX) continue;

        const hitTop = bird.y < p.topHeight;
        const hitBottom = bird.y + bird.size > p.bottomY;

        if (hitTop || hitBottom) {
            endGame();
            return;
        }
    }
}

/* Draw */
function drawBird() {
    ctx.fillStyle = 'black';
    ctx.fillRect(bird.x, bird.y, bird.size, bird.size);
}

function drawPipes() {
    ctx.fillStyle = 'white';
    ctx.strokeStyle = 'black';
    ctx.lineWidth = 2;

    for (const p of pipes) {
        ctx.fillRect(p.x, 0, PIPE_WIDTH, p.topHeight);
        ctx.strokeRect(p.x, 0, PIPE_WIDTH, p.topHeight);

        ctx.fillRect(
            p.x,
            p.bottomY,
            PIPE_WIDTH,
            canvas.height - p.bottomY
        );
        ctx.strokeRect(
            p.x,
            p.bottomY,
            PIPE_WIDTH,
            canvas.height - p.bottomY
        );
    }
}

/* Game over */
function endGame() {
    gameActive = false;
    gameOverEl.style.display = 'flex';
}

/* Input */
function handleInput() {
    if (gameActive) {
        bird.velocity = JUMP;
    } else {
        resetGame();
    }
}

document.addEventListener('keydown', e => {
    if (e.code === 'Space') {
        e.preventDefault();
        handleInput();
    }
});

canvas.addEventListener('click', handleInput);
canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    handleInput();
});

/* Loop */
function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameActive) {
        updateBird();
        updatePipes();
        checkPipeCollision();
        frame++;
    }

    drawBird();
    drawPipes();

    requestAnimationFrame(loop);
}

resetGame();
loop();
</script>
</body>
</html>
