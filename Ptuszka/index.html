    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
        }
        
        #gameContainer {
            position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        
        canvas {
            display: block;
            background-color: black;
        }
        
        #resetButton {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            padding: 8px 15px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.2s;
            z-index: 10;
        }
        
        #resetButton:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }
        
        #score {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 48px;
            font-weight: bold;
            color: white;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
            mix-blend-mode: difference;
        }
        
        #score.visible {
            opacity: 1;
        }
        
        #menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            display: none;
            background-color: rgba(0, 0, 0, 0.95);
            padding: 30px;
            border-radius: 10px;
            border: 3px solid white;
            color: white;
            max-height: 90vh;
            overflow-y: auto;
            min-width: 300px;
        }
        
        #menuTitle {
            font-size: 28px;
            margin-bottom: 20px;
        }
        
        #statsSection {
            display: none;
        }
        
        #finalScore {
            font-size: 20px;
            margin-top: 15px;
            color: #ddd;
        }
        
        #bestScore {
            font-size: 18px;
            margin-top: 10px;
            color: #aaa;
        }
        
        #totalCoinsDisplay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            font-weight: bold;
            color: white;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
            mix-blend-mode: difference;
        }
        
        #totalCoinsDisplay.visible {
            opacity: 1;
        }
        
        #coinsThisRun {
            font-size: 18px;
            margin-top: 10px;
            color: #aaa;
        }
        
        .menu-button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            margin: 8px;
            font-weight: bold;
            transition: background-color 0.3s;
            min-width: 200px;
        }
        
        .menu-button:hover {
            background-color: #45a049;
        }
        
        #shopButton {
            background-color: #2196F3;
        }
        
        #shopButton:hover {
            background-color: #0b7dda;
        }
        
        #shop {
            display: none;
            margin-top: 20px;
            text-align: left;
            max-width: 350px;
        }
        
        .shop-item {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .shop-item-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .shop-item-desc {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 10px;
        }
        
        .shop-item-status {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 8px;
        }
        
        .shop-buy-button {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            transition: background-color 0.3s;
            width: 100%;
        }
        
        .shop-buy-button:hover {
            background-color: #0b7dda;
        }
        
        .shop-buy-button:disabled {
            background-color: #555;
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        .upgrade-section {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .upgrade-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0;
        }
        
        .upgrade-info {
            flex: 1;
        }
        
        .upgrade-name {
            font-size: 14px;
            font-weight: bold;
        }
        
        .upgrade-level {
            font-size: 12px;
            color: #aaa;
        }
        
        .upgrade-button {
            background-color: #FF9800;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            border-radius: 3px;
            font-weight: bold;
            transition: background-color 0.3s;
            min-width: 80px;
        }
        
        .upgrade-button:hover {
            background-color: #F57C00;
        }
        
        .upgrade-button:disabled {
            background-color: #555;
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        #backToMenu {
            background-color: #666;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 15px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        
        #backToMenu:hover {
            background-color: #555;
        }
        
        .owned-indicator {
            color: #4CAF50;
            font-weight: bold;
        }
        
        .max-level {
            color: #FFD700;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <button id="resetButton">Сброс</button>
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div id="score">0</div>
        <div id="totalCoinsDisplay">🪙 0</div>
        
        <!-- Единое меню для всех случаев -->
        <div id="menu">
            <div id="menuTitle">Ptuška</div>
            
            <!-- Статистика (показывается только после смерти) -->
            <div id="statsSection">
                <div id="finalScore"></div>
                <div id="bestScore"></div>
                <div id="coinsThisRun"></div>
            </div>
            
            <div id="mainMenuSection">
                <button class="menu-button" id="playButton">🎮 Играть</button>
                <button class="menu-button" id="shopButton">🛒 Магазин</button>
            </div>
            
            <!-- Магазин -->
            <div id="shop">
                <!-- Щит -->
                <div class="shop-item" id="shieldItem">
                    <div class="shop-item-header">
                        <span>🛡️ Щит</span>
                        <span>10 🪙</span>
                    </div>
                    <div class="shop-item-desc">Уничтожает одну трубу при столкновении</div>
                    <div class="shop-item-status" id="shieldStatus">Не куплен</div>
                    <button class="shop-buy-button" id="buyShield">Купить</button>
                </div>
                
                <!-- Магнит -->
                <div class="shop-item" id="magnetItem">
                    <div class="shop-item-header">
                        <span>🧲 Магнит</span>
                        <span id="magnetPrice">20 🪙</span>
                    </div>
                    <div class="shop-item-desc">Притягивает монеты автоматически</div>
                    <div class="shop-item-status" id="magnetStatus">Не куплен</div>
                    <button class="shop-buy-button" id="buyMagnet">Купить</button>
                    
                    <!-- Улучшения магнита (появляются после покупки) -->
                    <div class="upgrade-section" id="magnetUpgrades" style="display: none;">
                        <div class="upgrade-row">
                            <div class="upgrade-info">
                                <div class="upgrade-name">📏 Радиус</div>
                                <div class="upgrade-level" id="radiusLevel">Уровень: 0/3</div>
                            </div>
                            <button class="upgrade-button" id="upgradeRadius">5 🪙</button>
                        </div>
                        <div class="upgrade-row">
                            <div class="upgrade-info">
                                <div class="upgrade-name">⚡ Скорость</div>
                                <div class="upgrade-level" id="speedLevel">Уровень: 0/3</div>
                            </div>
                            <button class="upgrade-button" id="upgradeSpeed">5 🪙</button>
                        </div>
                    </div>
                </div>
                
                <button id="backToMenu">Назад</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menuDiv = document.getElementById('menu');
        const menuTitle = document.getElementById('menuTitle');
        const statsSection = document.getElementById('statsSection');
        const mainMenuSection = document.getElementById('mainMenuSection');
        const scoreDiv = document.getElementById('score');
        const finalScoreDiv = document.getElementById('finalScore');
        const bestScoreDiv = document.getElementById('bestScore');
        const coinsThisRunDiv = document.getElementById('coinsThisRun');
        const totalCoinsDisplay = document.getElementById('totalCoinsDisplay');
        const resetButton = document.getElementById('resetButton');
        
        // Кнопки меню
        const playButton = document.getElementById('playButton');
        const shopButton = document.getElementById('shopButton');
        const shopDiv = document.getElementById('shop');
        const backToMenuButton = document.getElementById('backToMenu');
        
        // Основные параметры игры
        const GRAVITY = 0.5;
        const JUMP_STRENGTH = -8;
        const PIPE_SPEED = 3;
        const PIPE_WIDTH = 60;
        const PIPE_GAP = 180;
        const PIPE_SPAWN_INTERVAL = 90;
        const MOVE_SPEED = 2;
        
        // Флаги прогрессии (сохраняются в localStorage)
        let progressFlags = {
            hasBirdCreated: false,
            hasMovedLeft: false,
            hasActivatedJumps: false,
            hasActivatedGravity: false,
            hasPipesEnabled: false,
            hasCoinsEnabled: false,
            hasSeenScore: false,
            hasSeenCoins: false,
            hasPlayedFirstGame: false  // НОВЫЙ ФЛАГ
        };
        
        // Покупки в магазине
        let shopPurchases = {
            hasShield: false,
            hasMagnet: false,
            magnetRadiusLevel: 0,
            magnetSpeedLevel: 0
        };
        
        // Состояние игры: 'menu', 'playing', 'gameOver'
        let gameState = 'playing';
        
        let jumpCount = 0;
        
        // Загружаем флаги из localStorage
        function loadProgress() {
            const saved = localStorage.getItem('progressFlags');
            if (saved) {
                progressFlags = JSON.parse(saved);
            }
            
            const savedShop = localStorage.getItem('shopPurchases');
            if (savedShop) {
                shopPurchases = JSON.parse(savedShop);
            }
        }
        
        function saveProgress() {
            localStorage.setItem('progressFlags', JSON.stringify(progressFlags));
        }
        
        function saveShop() {
            localStorage.setItem('shopPurchases', JSON.stringify(shopPurchases));
        }
        
        // Полный сброс прогресса
        function resetProgress() {
            progressFlags = {
                hasBirdCreated: false,
                hasMovedLeft: false,
                hasActivatedJumps: false,
                hasActivatedGravity: false,
                hasPipesEnabled: false,
                hasCoinsEnabled: false,
                hasSeenScore: false,
                hasSeenCoins: false,
                hasPlayedFirstGame: false
            };
            shopPurchases = {
                hasShield: false,
                hasMagnet: false,
                magnetRadiusLevel: 0,
                magnetSpeedLevel: 0
            };
            jumpCount = 0;
            bestScore = 0;
            totalCoins = 0;
            coinsThisRun = 0;
            localStorage.clear();
            saveProgress();
            saveShop();
            restart();
        }
        
        // Объект птички
        let bird = {
            x: 200 - 15,
            y: 300 - 15,
            targetX: 80,
            width: 30,
            height: 30,
            velocity: 0,
            isMovingLeft: false
        };
        
        let pipes = [];
        let coins = [];
        let frameCount = 0;
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('bestScore')) || 0;
        let totalCoins = parseInt(localStorage.getItem('totalCoins')) || 0;
        let coinsThisRun = 0;
        let gameActive = true;
        let animationFrameId = null;
        
        let birdAppearing = false;
        let birdOpacity = 0;
        let passedPipes = new Set();
        let scoreVisible = false;
        
        // Магнит параметры
        const MAGNET_BASE_RADIUS = 60;
        const MAGNET_RADIUS_INCREMENT = 30;
        const MAGNET_BASE_SPEED = 3;
        const MAGNET_SPEED_INCREMENT = 2;
        
        function getMagnetRadius() {
            if (!shopPurchases.hasMagnet) return 0;
            return MAGNET_BASE_RADIUS + (shopPurchases.magnetRadiusLevel * MAGNET_RADIUS_INCREMENT);
        }
        
        function getMagnetSpeed() {
            if (!shopPurchases.hasMagnet) return 0;
            return MAGNET_BASE_SPEED + (shopPurchases.magnetSpeedLevel * MAGNET_SPEED_INCREMENT);
        }
        
        // Показать меню
        function showMenu(isGameOver = false) {
            gameState = isGameOver ? 'gameOver' : 'menu';
            
            if (isGameOver) {
                menuTitle.textContent = 'ИГРА ОКОНЧЕНА';
                statsSection.style.display = 'block';
                playButton.textContent = '🔄 Играть снова';
            } else {
                menuTitle.textContent = 'Ptuška';
                statsSection.style.display = 'none';
                playButton.textContent = '🎮 Играть';
            }
            
            menuDiv.style.display = 'block';
            shopDiv.style.display = 'none';
            mainMenuSection.style.display = 'block';
        }
        
        // Скрыть меню и начать игру
        function hideMenuAndPlay() {
            menuDiv.style.display = 'none';
            gameState = 'playing';
            restart();
        }
        
        // Инициализация
        function init() {
            loadProgress();
            totalCoinsDisplay.textContent = `🪙 ${totalCoins}`;
            
            if (progressFlags.hasSeenCoins) {
                totalCoinsDisplay.classList.add('visible');
            }
            
            // Если обучение пройдено и уже играли - показываем меню
            if (progressFlags.hasPlayedFirstGame) {
                showMenu(false);
                gameActive = false;
            }
        }
        
        // Создание трубы
        function createPipe() {
            const minGapY = 100;
            const maxGapY = canvas.height - PIPE_GAP - 100;
            const gapY = Math.random() * (maxGapY - minGapY) + minGapY;
            
            pipes.push({
                x: canvas.width,
                gapY: gapY,
                passed: false
            });
            
            if (progressFlags.hasCoinsEnabled) {
                coins.push({
                    x: canvas.width + PIPE_WIDTH / 2,
                    y: gapY + PIPE_GAP / 2,
                    radius: 10,
                    collected: false
                });
            }
        }
        
        // Обновление счёта
        function updateScore() {
            for (let pipe of pipes) {
                if (!pipe.passed && pipe.x + PIPE_WIDTH < bird.x) {
                    pipe.passed = true;
                    score++;
                    scoreDiv.textContent = score;
                    
                    if (!progressFlags.hasSeenScore) {
                        progressFlags.hasSeenScore = true;
                        scoreDiv.classList.add('visible');
                        scoreVisible = true;
                        saveProgress();
                    }
                    
                    if (score > bestScore) {
                        bestScore = score;
                        localStorage.setItem('bestScore', bestScore);
                    }
                }
            }
        }
        
        // Сбор монет
        function collectCoins() {
            const magnetRadius = getMagnetRadius();
            const magnetSpeed = getMagnetSpeed();
            
            for (let coin of coins) {
                if (coin.collected) continue;
                
                const dx = coin.x - (bird.x + bird.width / 2);
                const dy = coin.y - (bird.y + bird.height / 2);
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (shopPurchases.hasMagnet && distance < magnetRadius) {
                    const angle = Math.atan2(dy, dx);
                    coin.x -= Math.cos(angle) * magnetSpeed;
                    coin.y -= Math.sin(angle) * magnetSpeed;
                }
                
                if (distance < coin.radius + bird.width / 2) {
                    coin.collected = true;
                    totalCoins++;
                    coinsThisRun++;
                    localStorage.setItem('totalCoins', totalCoins);
                    totalCoinsDisplay.textContent = `🪙 ${totalCoins}`;
                    
                    if (!progressFlags.hasSeenCoins) {
                        progressFlags.hasSeenCoins = true;
                        totalCoinsDisplay.classList.add('visible');
                        saveProgress();
                    }
                }
            }
        }
        
        // Проверка столкновений
        function checkCollision() {
            if (!progressFlags.hasPipesEnabled) return false;
            
            // Проверка границ
            if (bird.y < 0 || bird.y + bird.height > canvas.height) {
                if (shopPurchases.hasShield) {
                    shopPurchases.hasShield = false;
                    saveShop();
                    bird.y = Math.max(0, Math.min(bird.y, canvas.height - bird.height));
                    bird.velocity = 0;
                    return false;
                }
                return true;
            }
            
            // Проверка столкновений с трубами
            for (let i = pipes.length - 1; i >= 0; i--) {
                let pipe = pipes[i];
                
                if (bird.x + bird.width > pipe.x && 
                    bird.x < pipe.x + PIPE_WIDTH) {
                    if (bird.y < pipe.gapY || 
                        bird.y + bird.height > pipe.gapY + PIPE_GAP) {
                        
                        // Если есть щит - уничтожаем трубу
                        if (shopPurchases.hasShield) {
                            shopPurchases.hasShield = false;
                            saveShop();
                            
                            // Удаляем трубу из массива
                            pipes.splice(i, 1);
                            
                            return false;
                        }
                        return true;
                    }
                }
            }
            
            return false;
        }
        
        // Прыжок
        function jump() {
            if (!progressFlags.hasBirdCreated) {
                progressFlags.hasBirdCreated = true;
                birdAppearing = true;
                birdOpacity = 0;
                saveProgress();
                return;
            }
            
            if (!progressFlags.hasMovedLeft) {
                bird.isMovingLeft = true;
                return;
            }
            
            if (!progressFlags.hasActivatedJumps) {
                progressFlags.hasActivatedJumps = true;
                saveProgress();
            }
            
            jumpCount++;
            
            if (jumpCount >= 4 && !progressFlags.hasActivatedGravity) {
                progressFlags.hasActivatedGravity = true;
                saveProgress();
            }
            
            if (jumpCount >= 5 && !progressFlags.hasPipesEnabled) {
                progressFlags.hasPipesEnabled = true;
                saveProgress();
            }
            
            if (jumpCount >= 6 && !progressFlags.hasCoinsEnabled) {
                progressFlags.hasCoinsEnabled = true;
                saveProgress();
            }
            
            bird.velocity = JUMP_STRENGTH;
        }
        
        // Перезапуск игры
        function restart() {
            coinsThisRun = 0;
            
            if (!progressFlags.hasBirdCreated) {
                birdAppearing = false;
                birdOpacity = 0;
            } else if (!birdAppearing) {
                birdAppearing = false;
                birdOpacity = 0;
                birdAppearing = false;
            }
            
            if (progressFlags.hasBirdCreated && progressFlags.hasMovedLeft) {
                bird.x = 80;
            } else {
                bird.x = 200 - 15;
            }
            
            bird.y = 300 - 15;
            bird.velocity = 0;
            bird.isMovingLeft = false;
            pipes = [];
            coins = [];
            frameCount = 0;
            score = 0;
            gameActive = true;
            menuDiv.style.display = 'none';
            scoreDiv.textContent = '0';
            
            if (progressFlags.hasSeenScore) {
                scoreDiv.classList.add('visible');
                scoreVisible = true;
            } else {
                scoreDiv.classList.remove('visible');
                scoreVisible = false;
            }
            
            if (progressFlags.hasSeenCoins) {
                totalCoinsDisplay.classList.add('visible');
            } else {
                totalCoinsDisplay.classList.remove('visible');
            }
            
            startGameLoop();
        }
        
        // Основной игровой цикл
        function gameLoop() {
            if (!gameActive) {
                if (animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                    animationFrameId = null;
                }
                return;
            }
            
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Логика движения птички
            if (bird.isMovingLeft && !progressFlags.hasMovedLeft) {
                if (bird.x > bird.targetX) {
                    bird.x -= MOVE_SPEED;
                    if (bird.x <= bird.targetX) {
                        bird.x = bird.targetX;
                        bird.isMovingLeft = false;
                        progressFlags.hasMovedLeft = true;
                        saveProgress();
                    }
                }
                bird.velocity = 0;
            } else if (progressFlags.hasActivatedGravity) {
                bird.velocity += GRAVITY;
                bird.y += bird.velocity;
            } else if (progressFlags.hasActivatedJumps) {
                if (bird.velocity < 0) {
                    bird.velocity += 0.5;
                    if (bird.velocity >= 0) {
                        bird.velocity = 0;
                    }
                }
                bird.y += bird.velocity;
            }
            
            // Анимация появления птички
            if (birdAppearing) {
                birdOpacity += 0.02;
                if (birdOpacity >= 1) {
                    birdOpacity = 1;
                    birdAppearing = false;
                }
            } else if (progressFlags.hasBirdCreated) {
                birdOpacity = 1;
            }
            
            // Визуализация магнита (радиус)
            if (shopPurchases.hasMagnet && progressFlags.hasBirdCreated) {
                const magnetRadius = getMagnetRadius();
                ctx.globalAlpha = 0.15;
                ctx.fillStyle = 'cyan';
                ctx.beginPath();
                ctx.arc(bird.x + bird.width / 2, bird.y + bird.height / 2, magnetRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
            
            // Рисуем птичку
            if (progressFlags.hasBirdCreated) {
                ctx.globalAlpha = birdOpacity;
                
                // Щит (светящаяся рамка)
                if (shopPurchases.hasShield) {
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = 'cyan';
                    ctx.strokeStyle = 'cyan';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(bird.x - 2, bird.y - 2, bird.width + 4, bird.height + 4);
                    ctx.shadowBlur = 0;
                }
                
                ctx.fillStyle = 'white';
                ctx.fillRect(bird.x, bird.y, bird.width, bird.height);
                ctx.globalAlpha = 1.0;
            }
            
            frameCount++;
            
            // Создание труб
            if (progressFlags.hasPipesEnabled && frameCount % PIPE_SPAWN_INTERVAL === 0) {
                createPipe();
            }
            
            // Обновление и отрисовка труб
            for (let i = pipes.length - 1; i >= 0; i--) {
                let pipe = pipes[i];
                pipe.x -= PIPE_SPEED;
                
                if (pipe.x + PIPE_WIDTH < 0) {
                    pipes.splice(i, 1);
                    continue;
                }
                
                ctx.fillStyle = 'white';
                ctx.fillRect(pipe.x, 0, PIPE_WIDTH, pipe.gapY);
                ctx.fillRect(pipe.x, pipe.gapY + PIPE_GAP, PIPE_WIDTH, canvas.height - pipe.gapY - PIPE_GAP);
            }
            
            // Обновление и отрисовка монет
            for (let i = coins.length - 1; i >= 0; i--) {
                let coin = coins[i];
                
                if (coin.collected) {
                    coins.splice(i, 1);
                    continue;
                }
                
                coin.x -= PIPE_SPEED;
                
                if (coin.x + coin.radius < 0) {
                    coins.splice(i, 1);
                    continue;
                }
                
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(coin.x, coin.y, coin.radius, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Сбор монет
            if (progressFlags.hasCoinsEnabled) {
                collectCoins();
            }
            
            // Обновление счёта
            if (progressFlags.hasPipesEnabled) {
                updateScore();
            }
            
            // Проверка столкновений
            if (checkCollision()) {
                gameActive = false;
                if (animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                    animationFrameId = null;
                }
                
                // Отмечаем что сыграли первую игру
                if (!progressFlags.hasPlayedFirstGame) {
                    progressFlags.hasPlayedFirstGame = true;
                    saveProgress();
                }
                
                finalScoreDiv.textContent = `Ваш счёт: ${score}`;
                bestScoreDiv.textContent = `Лучший результат: ${bestScore}`;
                
                if (progressFlags.hasCoinsEnabled) {
                    coinsThisRunDiv.textContent = `Монет собрано: ${coinsThisRun}`;
                    coinsThisRunDiv.style.display = 'block';
                } else {
                    coinsThisRunDiv.style.display = 'none';
                }
                
                updateShopUI();
                showMenu(true);
                return;
            }
            
            animationFrameId = requestAnimationFrame(gameLoop);
        }
        
        function startGameLoop() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
            animationFrameId = requestAnimationFrame(gameLoop);
        }
        
        // === МАГАЗИН ===
        
        function updateShopUI() {
            // Обновление статуса щита
            const shieldStatus = document.getElementById('shieldStatus');
            const buyShieldBtn = document.getElementById('buyShield');
            
            if (shopPurchases.hasShield) {
                shieldStatus.innerHTML = '<span class="owned-indicator">✓ Куплен (активен)</span>';
                buyShieldBtn.disabled = true;
                buyShieldBtn.textContent = 'Уже куплен';
            } else {
                shieldStatus.textContent = 'Не куплен';
                buyShieldBtn.disabled = totalCoins < 10;
                buyShieldBtn.textContent = totalCoins < 10 ? 'Недостаточно монет' : 'Купить';
            }
            
            // Обновление статуса магнита
            const magnetStatus = document.getElementById('magnetStatus');
            const buyMagnetBtn = document.getElementById('buyMagnet');
            const magnetUpgrades = document.getElementById('magnetUpgrades');
            
            if (shopPurchases.hasMagnet) {
                magnetStatus.innerHTML = '<span class="owned-indicator">✓ Куплен</span>';
                buyMagnetBtn.style.display = 'none';
                magnetUpgrades.style.display = 'block';
                
                // Обновление улучшений радиуса
                const radiusLevel = document.getElementById('radiusLevel');
                const upgradeRadiusBtn = document.getElementById('upgradeRadius');
                const radiusLvl = shopPurchases.magnetRadiusLevel;
                radiusLevel.textContent = `Уровень: ${radiusLvl}/3`;
                
                if (radiusLvl >= 3) {
                    radiusLevel.innerHTML = '<span class="max-level">MAX УРОВЕНЬ</span>';
                    upgradeRadiusBtn.disabled = true;
                    upgradeRadiusBtn.textContent = 'МАКС';
                } else {
                    const prices = [5, 10, 15];
                    const price = prices[radiusLvl];
                    upgradeRadiusBtn.disabled = totalCoins < price;
                    upgradeRadiusBtn.textContent = totalCoins < price ? `${price} 🪙 (мало)` : `${price} 🪙`;
                }
                
                // Обновление улучшений скорости
                const speedLevel = document.getElementById('speedLevel');
                const upgradeSpeedBtn = document.getElementById('upgradeSpeed');
                const speedLvl = shopPurchases.magnetSpeedLevel;
                speedLevel.textContent = `Уровень: ${speedLvl}/3`;
                
                if (speedLvl >= 3) {
                    speedLevel.innerHTML = '<span class="max-level">MAX УРОВЕНЬ</span>';
                    upgradeSpeedBtn.disabled = true;
                    upgradeSpeedBtn.textContent = 'МАКС';
                } else {
                    const prices = [5, 10, 15];
                    const price = prices[speedLvl];
                    upgradeSpeedBtn.disabled = totalCoins < price;
                    upgradeSpeedBtn.textContent = totalCoins < price ? `${price} 🪙 (мало)` : `${price} 🪙`;
                }
            } else {
                magnetStatus.textContent = 'Не куплен';
                buyMagnetBtn.style.display = 'block';
                buyMagnetBtn.disabled = totalCoins < 20;
                buyMagnetBtn.textContent = totalCoins < 20 ? 'Недостаточно монет' : 'Купить';
                magnetUpgrades.style.display = 'none';
            }
        }
        
        function buyShield() {
            if (totalCoins >= 10 && !shopPurchases.hasShield) {
                totalCoins -= 10;
                shopPurchases.hasShield = true;
                localStorage.setItem('totalCoins', totalCoins);
                totalCoinsDisplay.textContent = `🪙 ${totalCoins}`;
                saveShop();
                updateShopUI();
            }
        }
        
        function buyMagnet() {
            if (totalCoins >= 20 && !shopPurchases.hasMagnet) {
                totalCoins -= 20;
                shopPurchases.hasMagnet = true;
                localStorage.setItem('totalCoins', totalCoins);
                totalCoinsDisplay.textContent = `🪙 ${totalCoins}`;
                saveShop();
                updateShopUI();
            }
        }
        
        function upgradeRadius() {
            const prices = [5, 10, 15];
            const currentLevel = shopPurchases.magnetRadiusLevel;
            
            if (currentLevel < 3 && totalCoins >= prices[currentLevel]) {
                totalCoins -= prices[currentLevel];
                shopPurchases.magnetRadiusLevel++;
                localStorage.setItem('totalCoins', totalCoins);
                totalCoinsDisplay.textContent = `🪙 ${totalCoins}`;
                saveShop();
                updateShopUI();
            }
        }
        
        function upgradeSpeed() {
            const prices = [5, 10, 15];
            const currentLevel = shopPurchases.magnetSpeedLevel;
            
            if (currentLevel < 3 && totalCoins >= prices[currentLevel]) {
                totalCoins -= prices[currentLevel];
                shopPurchases.magnetSpeedLevel++;
                localStorage.setItem('totalCoins', totalCoins);
                totalCoinsDisplay.textContent = `🪙 ${totalCoins}`;
                saveShop();
                updateShopUI();
            }
        }
        
        // === СОБЫТИЯ ===
        
        // Кнопка "Играть"
        playButton.addEventListener('click', () => {
            hideMenuAndPlay();
        });
        
        // Кнопка "Магазин"
        shopButton.addEventListener('click', () => {
            shopDiv.style.display = 'block';
            mainMenuSection.style.display = 'none';
            updateShopUI();
        });
        
        // Кнопка "Назад" в магазине
        backToMenuButton.addEventListener('click', () => {
            shopDiv.style.display = 'none';
            mainMenuSection.style.display = 'block';
        });
        
        // Покупки в магазине
        document.getElementById('buyShield').addEventListener('click', buyShield);
        document.getElementById('buyMagnet').addEventListener('click', buyMagnet);
        document.getElementById('upgradeRadius').addEventListener('click', upgradeRadius);
        document.getElementById('upgradeSpeed').addEventListener('click', upgradeSpeed);
        
        // Управление игрой
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (gameState === 'playing' && gameActive) {
                    jump();
                } else if (gameState === 'menu' || gameState === 'gameOver') {
                    if (shopDiv.style.display === 'none') {
                        hideMenuAndPlay();
                    }
                }
            }
        });
        
        canvas.addEventListener('mousedown', (e) => {
            e.preventDefault();
            if (gameState === 'playing' && gameActive) {
                jump();
            } else if (gameState === 'menu' || gameState === 'gameOver') {
                if (shopDiv.style.display === 'none') {
                    hideMenuAndPlay();
                }
            }
        });
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (gameState === 'playing' && gameActive) {
                jump();
            } else if (gameState === 'menu' || gameState === 'gameOver') {
                if (shopDiv.style.display === 'none') {
                    hideMenuAndPlay();
                }
            }
        }, { passive: false });
        
        resetButton.addEventListener('click', () => {
            resetProgress();
        });
        
        // Запуск
        init();
        
        // Запускаем игру только если меню не показано
        if (gameState === 'playing') {
            startGameLoop();
        }
    </script>
</body>
</html>
