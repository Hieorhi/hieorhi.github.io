<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hieorhi Skamarochaŭ</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
  font-family: Helvetica Neue, Arial, sans-serif;
  background: #ffffff;
  color: #111;
}

/* Header */
header {
  padding: 32px 16px;
  text-align: center;
  font-size: 3rem;
  font-weight: 600;
}

/* Projects container */
main {
  display: flex;
  justify-content: center;
  padding: 32px;
}

/* Project square */
.project {
  width: 260px;
  height: 260px;
  border: 2px solid #000;
  display: flex;
  flex-direction: column;
  text-decoration: none;
  color: inherit;
  background: #fff;
}

/* Screenshot area */
.project-image {
  flex: 1;
  overflow: hidden;
  background: #f5f5f5;
}

.project-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Title area */
.project-title {
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-top: 2px solid #000;
  font-size: 1.05rem;
}
</style>
</head>

<body>

<header>
  Hieorhi Skamarochaŭ
</header>

<main>
  <a class="project" href="https://hieorhi.github.io/Ptuszka/" target="_blank">
    <div class="project-image">
      <img src="ptuszka.png" alt="Ptuška">
    </div>
    <div class="project-title">
      Ptuška
    </div>
  </a>
</main>

</body>
</html>
